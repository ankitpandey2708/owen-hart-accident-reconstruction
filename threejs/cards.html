<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{--ink:#eef1f7;--dim:#8f99ad;--amber:#ffb21f;--red:#ff3b30}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
  body.solid{background:#06080e}
  body.clear{background:transparent}
  canvas{position:absolute;inset:0}
  .r{position:absolute;opacity:0}
  .kicker{font-size:24px;letter-spacing:.32em;font-weight:700;color:var(--amber)}
  .h1{font-size:112px;font-weight:800;letter-spacing:-.01em;line-height:1}
  .h2{font-size:40px;font-weight:400;color:#cdd3df}
  .note{font-size:24px;color:var(--dim);line-height:1.5}
  .row{font-size:38px;display:flex;gap:36px;align-items:baseline}
  .row b{color:var(--amber);min-width:330px;font-weight:700;text-align:right}
  .rule{position:absolute;height:3px;background:var(--amber);opacity:0}
  .hud{font-family:"Cascadia Mono","Consolas",monospace}
  .badge{font-size:26px;font-weight:800;letter-spacing:.25em;padding:8px 18px;border:2px solid currentColor;border-radius:4px}
  .readout{font-size:44px;line-height:1.45;background:rgba(5,8,14,.72);padding:22px 30px;border-left:5px solid var(--amber)}
  .readout span{color:var(--dim);font-size:26px;display:inline-block;width:150px}
  .call{font-size:36px;font-weight:700;background:rgba(5,8,14,.78);padding:16px 26px;border-left:5px solid var(--red)}
  .call small{display:block;font-size:24px;font-weight:400;color:#c3cad8;margin-top:4px}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body>
<div id="ui"></div>
<script type="module">
import * as THREE from 'three';
const ID = new URLSearchParams(location.search).get('scene');
const HUD = ID === 'hud5';
document.body.className = HUD ? 'clear' : 'solid';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ui = document.getElementById('ui');
function el(cls, html, css){ const d=document.createElement('div'); d.className='r '+cls; d.innerHTML=html; Object.assign(d.style, css); ui.appendChild(d); return d; }
const show=[];   // [el, tIn, tOut]
function at(e,tin,tout=1e9){ show.push([e,tin,tout]); return e; }

// three.js background: slow drifting dust + faint vertical "cable" line
let renderer, scene, cam, pts;
if (!HUD){
  renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
  renderer.setSize(1920,1080); document.body.prepend(renderer.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x06080e);
  cam = new THREE.PerspectiveCamera(50, 16/9, .1, 200); cam.position.set(0,0,30);
  const N=1600, g=new THREE.BufferGeometry(), a=new Float32Array(N*3);
  let s=7; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  for(let i=0;i<N;i++){ a[i*3]=(rnd()-.5)*90; a[i*3+1]=(rnd()-.5)*50; a[i*3+2]=(rnd()-.5)*40; }
  g.setAttribute('position', new THREE.BufferAttribute(a,3));
  pts = new THREE.Points(g, new THREE.PointsMaterial({color:0x8a95b0, size:.09, transparent:true, opacity:.55}));
  scene.add(pts);
  const line = new THREE.Mesh(new THREE.BoxGeometry(.04,60,.04), new THREE.MeshBasicMaterial({color:0xffb21f, transparent:true, opacity:.25}));
  line.position.set(17,0,0); scene.add(line);
}

const L = (x,y)=>({left:x+'px', top:y+'px'});
if (ID==='s1'){
  at(el('kicker','FORENSIC RECONSTRUCTION · SAFETY STUDY', L(140,330)), .3);
  at(el('h1','The Owen Hart<br>Accident', L(140,385)), .8);
  at(el('h2','Kemper Arena · Kansas City, Missouri · May 23, 1999', L(140,640)), 1.6);
  at(el('note','Reconstruction uses a generic crash-test mannequin. Fall timings are derived from free-fall physics<br>using the commonly reported height of ~78 ft (24 m); some reports give ~90 ft.', L(140,880)), 3);
}
if (ID==='s2'){
  at(el('kicker','WHO HE WAS', L(140,250)), .2);
  at(el('h1','Owen Hart', L(140,300)), .5);
  at(el('h2','May 7, 1965 – May 23, 1999 · age 34', L(140,430)), 1.2);
  const rows=[['Hometown','Calgary, Alberta, Canada',2.2],['Family','Youngest of the Hart wrestling family',4.2],['In the ring','One of the most technically gifted of his era',7.2],['At home','Husband to Martha · father of two',11.2]];
  rows.forEach(([k,v,t],i)=> at(el('row',`<b>${k}</b><span>${v}</span>`, L(60,560+i*82)), t));
}
if (ID==='s6'){
  at(el('kicker','AFTERMATH · TIMELINE', L(140,120)), .2);
  const rows=[['On air','TV viewers saw a pre-recorded promo, not the fall',.4],
    ['In the ring','EMTs performed CPR; no response',4.6],
    ['7:59 PM','Arrives at Truman Medical Center, Kansas City',7.2],
    ['8:12 PM','Pronounced dead, age 34',11.6],
    ['+15 min','Show halted, then continued',15.2],
    ['~1 hr later','Announcer Jim Ross tells viewers Hart has died',19.0],
    ['Nov 2, 2000','WWF settles the family’s wrongful-death suit: US$18 million',25.2]];
  rows.forEach(([k,v,t],i)=> at(el('row',`<b>${k}</b><span>${v}</span>`, L(40,210+i*104)), t));
  at(el('note','Sources: Wikipedia, “Over the Edge (1999)” and “Owen Hart”; Deseret News (Oct 31, 2000); Robb &amp; Robb LLC case archive.', L(140,970)), 26);
}
if (ID==='s8'){
  at(el('kicker','IN MEMORY', L(140,330)), .3);
  at(el('h1','Owen Hart', L(140,385)), .8);
  at(el('h2','1965 – 1999', L(140,520)), 1.6);
  at(el('note','His widow, Martha Hart, founded the Owen Hart Foundation in his memory.', L(140,640)), 1.2);
}
// ---------------- HUD for the Blender reconstruction (transparent overlay)
let hudUpdate=()=>{};
if (HUD){
  const FPS=30, G=9.81, DROP=23.0, TF=Math.sqrt(2*DROP/G), KG=103;
  const SEG=[[0,60,-2,0],[60,66,0,.2],[66,200,.2,4.67],[200,225,4.67,4.67],[225,485,-.3,2.0],[485,725,2.0,3.4],[725,860,3.4,4.2],[860,1005,4.2,4.2]];
  const tauAt=f=>{ for(const [a,b,x,y] of SEG) if(f>=a&&f<b) return x+(y-x)*(f-a)/Math.max(1,b-a); return 4.2; };
  at(el('kicker','RECONSTRUCTION · GENERIC MANNEQUIN', L(60,50)), 0);
  const rt = at(el('badge hud','REAL TIME', {left:'60px',top:'100px',color:'#eef1f7'}), 2.0, 6.7);
  const rp = at(el('badge hud','REPLAY · SLOW MOTION', {left:'60px',top:'100px',color:'#ffb21f'}), 7.4, 33.5);
  at(el('call','Shackle releases<small>still near the rafters · no backup line</small>', L(1180,760)), 1.9, 6.0);
  const ro = at(el('readout hud','', L(60,700)), 7.6, 33.5);
  at(el('call','Chest-first onto the top rope<small>~1 ft from the corner turnbuckle</small>', L(1150,170)), 17.0, 33.5);
  at(el('call',`≈${Math.round(0.5*KG*(G*TF)**2/1000)} kJ of kinetic energy at impact<small>at ~103 kg billed weight · free fall, no drag</small>`, L(1150,330)), 21.0, 33.5);
  at(el('call','Injury: severed aorta<small>fatal internal bleeding from blunt force trauma</small>', L(1150,490)), 26.0, 33.5);
  hudUpdate=(t)=>{
    const f=Math.round(t*FPS); let tau=Math.max(0, Math.min(tauAt(f), TF));
    if (f>=725) tau=TF;
    const v=G*tau, d=.5*G*tau*tau;
    ro.innerHTML = `<span>time</span>${tau.toFixed(2)} s<br><span>fallen</span>${(d*3.281).toFixed(0).padStart(2,' ')} ft<br><span>speed</span>${(v*2.237).toFixed(0)} mph <span style="width:auto">(${(v*3.6).toFixed(0)} km/h)</span>` +
      (tau>=TF-1e-6 ? '<br><span style="color:#ff3b30;width:auto;font-weight:700">■ IMPACT</span>' : '');
  };
}
window.renderAt = (t)=>{
  for (const [e,a,b] of show) e.style.opacity = clamp((t-a)/.6)*clamp((b-t)/.4);
  hudUpdate(t);
  if (renderer){ pts.rotation.y = t*.012; pts.position.y = t*.08; cam.position.x = Math.sin(t*.05)*1.5; cam.lookAt(0,0,0); renderer.render(scene,cam); }
};
window.ready = true;
</script>
</body></html>
