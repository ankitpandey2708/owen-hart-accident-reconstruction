<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{--bg:#070a12;--ink:#e9edf5;--dim:#8d97ab;--amber:#ffb21f;--red:#ff3b30;--green:#34d27b}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
  canvas{position:absolute;inset:0}
  .lbl{position:absolute;font-size:30px;font-weight:600;white-space:nowrap;transform:translate(-50%,-50%);opacity:0;text-shadow:0 2px 12px #000}
  .lbl small{display:block;font-size:22px;font-weight:400;color:var(--dim)}
  .card{position:absolute;opacity:0;background:rgba(10,14,24,.88);border:1px solid #2a3348;border-left:6px solid var(--amber);padding:28px 36px;border-radius:6px}
  .card h3{margin:0 0 8px;font-size:22px;letter-spacing:.18em;color:var(--amber);font-weight:700}
  .card p{margin:0;font-size:34px;line-height:1.35}
  .tag{position:absolute;left:80px;top:60px;font-size:22px;letter-spacing:.25em;color:var(--dim);font-weight:700}
  .col{position:absolute;top:150px;width:780px}
  .col h2{font-size:40px;margin:0 0 26px}
  .item{font-size:31px;line-height:1.3;margin:0 0 22px;padding-left:46px;position:relative;opacity:0}
  .item:before{position:absolute;left:0;top:0;font-weight:800}
  .bad .item:before{content:"✕";color:var(--red)} .good .item:before{content:"✓";color:var(--green)}
  .bad h2{color:var(--red)} .good h2{color:var(--green)}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body>
<div id="ui"></div>
<script type="module">
import * as THREE from 'three';
const SCENE = new URLSearchParams(location.search).get('scene') || 's4';
const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a12);
scene.fog = new THREE.Fog(0x070a12, 30, 140);
const cam = new THREE.PerspectiveCamera(35, W/H, 0.01, 500);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x10131c, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(4, 6, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0xffb060, 1.6); rim.position.set(-5, 2, -4); scene.add(rim);

const ui = document.getElementById('ui');
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm = x => { x = clamp(x); return x*x*(3-2*x); };
const win = (t,a,b,f=0.4)=> clamp((t-a)/f) * clamp((b-t)/f);   // fade window
const lerp = (a,b,k)=>a+(b-a)*k;
const V = (x,y,z)=>new THREE.Vector3(x,y,z);
const mat = (c,o={})=>new THREE.MeshStandardMaterial({color:c, roughness:.5, metalness:0, ...o});
const M = {
  dummy: mat(0xf2b80d), dark: mat(0x15161a), vest: mat(0x10131d,{roughness:.8}),
  steel: mat(0xd8dde6,{metalness:1, roughness:.18}), cable: mat(0xcfd6e0,{metalness:1, roughness:.25}),
  red: mat(0xff3b30,{emissive:0xff2010, emissiveIntensity:.8}), amber: mat(0xffb21f,{emissive:0xffa000, emissiveIntensity:.6}),
  green: mat(0x34d27b,{emissive:0x20a050, emissiveIntensity:.5}), canvas: mat(0xd9dce4), rope: mat(0xc0201a), pad: mat(0x1f3fa8), floor: mat(0x0d1018,{roughness:.9})
};
function mesh(g, m, p=[0,0,0], parent=scene){ const o=new THREE.Mesh(g,m); o.position.set(...p); parent.add(o); return o; }
function label(html, cls=''){ const d=document.createElement('div'); d.className='lbl '+cls; d.innerHTML=html; ui.appendChild(d); return d; }
function place(el, world, alpha){ cam.updateMatrixWorld(); const p=world.clone().project(cam); el.style.left=((p.x+1)/2*W)+'px'; el.style.top=((1-p.y)/2*H)+'px'; el.style.opacity=alpha; }
function card(html, style){ const d=document.createElement('div'); d.className='card'; d.innerHTML=html; Object.assign(d.style, style); ui.appendChild(d); return d; }
function line(points, m){ const c=new THREE.CatmullRomCurve3(points); return new THREE.Mesh(new THREE.TubeGeometry(c, 64, .006, 8), m); }

// -------- dummy upper body with vest harness (shared builder)
function buildDummy(parent, full=false){
  const g = new THREE.Group(); parent.add(g);
  mesh(new THREE.BoxGeometry(.42,.62,.25), M.dummy, [0,0,0], g);
  mesh(new THREE.SphereGeometry(.13,32,16), M.dummy, [0,.5,0], g);
  mesh(new THREE.CylinderGeometry(.05,.05,.12), M.dark, [0,.35,0], g);
  for (const s of [-1,1]){
    const a = mesh(new THREE.CylinderGeometry(.06,.06,.36), M.dummy, [s*.29,.08,0], g); a.rotation.z = s*.18;
    mesh(new THREE.SphereGeometry(.07,16,12), M.dark, [s*.25,.27,0], g);
    if (full){
      mesh(new THREE.CylinderGeometry(.08,.08,.85), M.dummy, [s*.11,-.93,0], g);
      mesh(new THREE.CylinderGeometry(.06,.06,.32), M.dummy, [s*.36,-.22,-.05], g);
    }
  }
  if (full) mesh(new THREE.BoxGeometry(.38,.2,.24), M.dark, [0,-.42,0], g);
  // vest
  mesh(new THREE.BoxGeometry(.45,.14,.28), M.vest, [0,.1,0], g);
  for (const s of [-1,1]) mesh(new THREE.BoxGeometry(.06,.42,.28), M.vest, [s*.12,.2,0], g);
  mesh(new THREE.BoxGeometry(.15,.15,.03), M.vest, [0,.25,-.145], g);
  const dring = mesh(new THREE.TorusGeometry(.035,.008,10,24), M.steel, [0,.33,-.16], g);
  return g;
}
// -------- snap shackle (stylised marine quick-release)
function buildShackle(parent){
  const s = new THREE.Group(); parent.add(s);
  mesh(new THREE.TorusGeometry(.03,.007,10,24), M.steel, [0,.11,0], s);                 // swivel eye
  mesh(new THREE.CylinderGeometry(.012,.012,.04), M.steel, [0,.07,0], s);
  const body = mesh(new THREE.TorusGeometry(.045,.01,12,32,Math.PI*1.35), M.steel, [0,0,0], s); body.rotation.z = -Math.PI*.18;
  const gp = new THREE.Group(); gp.position.set(.045,-.005,0); s.add(gp);            // gate pivot
  const gate = mesh(new THREE.BoxGeometry(.016,.075,.016), M.steel, [0,-.035,0], gp);
  const plunger = mesh(new THREE.CylinderGeometry(.006,.006,.05), M.amber, [-.03,.035,0], s); plunger.rotation.z = Math.PI/2;
  const lan = new THREE.Group(); s.add(lan); lan.position.set(-.06,.035,0);
  const lanyard = line([V(0,0,0),V(-.02,-.06,.01),V(-.01,-.14,0),V(0,-.2,.01)], M.red); lan.add(lanyard);
  mesh(new THREE.SphereGeometry(.012,12,8), M.red, [0,-.2,.01], lan);
  return {s, gp, plunger, lan};
}

const labels = [];
let renderAt;

if (SCENE === 's4'){
  // ===== Group A: harness + shackle close-up at origin
  const A = new THREE.Group(); scene.add(A);
  const dummy = buildDummy(A);
  const sh = buildShackle(A); sh.s.position.set(0,.47,-.16); sh.s.scale.setScalar(1.6);
  const cableA = mesh(new THREE.CylinderGeometry(.006,.006,3), M.cable, [0,2.17,-.16], A);
  // floor glow disc
  mesh(new THREE.CircleGeometry(3,64), M.floor, [0,-1,0], A).rotation.x = -Math.PI/2;

  // ===== Group B: elevation diagram of the planned stunt (at x=100)
  const B = new THREE.Group(); B.position.set(100,0,0); scene.add(B);
  mesh(new THREE.BoxGeometry(12,.4,.4), mat(0x3a4256,{metalness:.8}), [0,25.5,0], B);           // rafter
  mesh(new THREE.BoxGeometry(6.1,1.2,6.1), M.dark, [0,.6,0], B);                             // ring base
  mesh(new THREE.BoxGeometry(6.1,.06,6.1), M.canvas, [0,1.22,0], B);
  for (const x of [-3.05,3.05]) for (const z of [-3.05,3.05]){
    mesh(new THREE.CylinderGeometry(.06,.06,1.5), M.steel, [x,1.95,z], B);
    for (const y of [1.65,2.05,2.5]) mesh(new THREE.BoxGeometry(.2,.26,.2), M.pad, [x*.97,y,z*.97], B);
  }
  for (const y of [1.65,2.05,2.5]) for (const [p,r] of [[[0,y,3.05],0],[[0,y,-3.05],0],[[3.05,y,0],1],[[-3.05,y,0],1]]){
    const o = mesh(new THREE.CylinderGeometry(.025,.025,6.1), M.rope, p, B); o.rotation.set(0,0,Math.PI/2); if (r) o.rotation.y = Math.PI/2;
  }
  mesh(new THREE.PlaneGeometry(60,60), M.floor, [0,0,0], B).rotation.x = -Math.PI/2;
  const cableB = mesh(new THREE.CylinderGeometry(.03,.03,1), M.cable, [0,0,0], B);
  const fig = new THREE.Group(); B.add(fig); buildDummy(fig, true); fig.scale.setScalar(1.0);
  // planned release marker
  const relY = 4.2;
  const dash = new THREE.Group(); B.add(dash);
  for (let i=0;i<14;i++) mesh(new THREE.BoxGeometry(.35,.05,.05), M.amber, [-3.5+i*.5,relY,0], dash);
  // ruler
  const ruler = new THREE.Group(); B.add(ruler); ruler.position.set(-5.2,0,0);
  mesh(new THREE.BoxGeometry(.06,24.3,.06), M.amber, [0,1.2+12.15,0], ruler);
  for (let f=0; f<=80; f+=10){ mesh(new THREE.BoxGeometry(.5,.05,.05), M.amber, [0,1.2+f*.3048,0], ruler); }

  // ---- labels / cards
  const L = {
    vest: label('Padded vest harness<small>worn under the costume</small>'),
    dring: label('Attachment point<small>single point, upper back</small>'),
    shackle: label('<span style="color:var(--amber)">Quick-release snap shackle</span><small>marine / yacht-racing hardware</small>'),
    notrated: label('<span style="color:var(--red)">Not rated for life safety</span><small>opens with a small tug on the lanyard</small>'),
    cable: label('Steel cable to rafters'),
    plan: label('<span style="color:var(--amber)">PLANNED release point</span><small>a few feet above the mat</small>'),
    gag: label('“Tangled” comedy pratfall<small>drop the last short distance</small>'),
    ruler: label('~78 ft', ''),
  };
  const c1998 = card('<h3>EARLIER VERSION</h3><p>Nov 15, 1998 · <i>Sunday Night Heat</i><br>Blue Blazer descent stunt performed<br>with a <b>different harness configuration</b></p>', {left:'120px', top:'640px', width:'760px'});
  const tag = document.createElement('div'); tag.className='tag'; ui.appendChild(tag); tag.textContent='THE RIG';

  renderAt = (t) => {
    // gate / pin animation
    const pull = sm((t-9.6)/.5) * (1 - sm((t-12.6)/.6));
    sh.plunger.position.x = -.03 - .03*pull; sh.lan.position.y = .035 - .03*pull;
    sh.gp.rotation.z = -1.25 * sm((t-10.0)/.35) * (1 - sm((t-12.6)/.6));
    // camera
    let p, look;
    if (t < 6.5){ const a = lerp(-.4, -2.4, sm(t/6.5)); p = V(Math.sin(a)*2.2, .55+.2*sm(t/6.5), Math.cos(a)*2.2); look = V(0,.22,0); }
    else if (t < 14){ const k = sm((t-6.5)/1.5); const d = .5*sm((t-6.5)/7.5);
      const p0 = V(Math.sin(-2.4)*2.2, .75, Math.cos(-2.4)*2.2), sh0 = V(0,.52,-.16);
      const p1 = sh0.clone().add(V(-.62+d*.3, .14, -.78+d*.08));
      p = p0.lerp(p1, k); look = V(0,.22,0).lerp(sh0, k); }
    else if (t < 19){ const a=-1.9+ .6*sm((t-14)/5); p = V(Math.sin(a)*1.6, .9, Math.cos(a)*1.6); look=V(0,.4,-.1); }
    else { const k = sm((t-19)/1.2); p = V(100+18, 11.5, 34); look = V(100, 11, 0); }
    cam.position.copy(p); cam.lookAt(look);
    tag.textContent = t < 19 ? 'THE RIG' : 'THE PLAN';
    tag.style.opacity = 1;
    // plan animation
    const top = 24.6; let y = top;
    if (t >= 19){
      const d = sm((t-19.8)/5.0); y = lerp(top, relY+.9, d);
      if (t > 25.5){ const ff = Math.min(t-25.5, Math.sqrt(2*(relY+.9-1.55)/9.81)); y = relY+.9 - .5*9.81*ff*ff; }
    }
    const wig = (t>24.8 && t<25.5) ? Math.sin(t*28)*.08 : 0;
    fig.position.set(wig, y, 0);
    fig.rotation.x = t > 25.5 ? -1.45*sm((t-25.6)/.45) : 0;
    if (t > 25.5) fig.position.y = Math.max(fig.position.y, 1.55 + .0);
    const cbTop = 25.3, cbBot = (t>25.5) ? relY+.9+.45 : y+.45;
    cableB.position.set(0,(cbTop+cbBot)/2,0); cableB.scale.set(1,cbTop-cbBot,1);
    // labels
    place(L.vest, V(.45,.0,.05), win(t,.8,6.4));
    place(L.dring, V(-.5,.42,-.2), win(t,2.5,6.4));
    place(L.cable, V(.35,1.1,-.16), win(t,3.5,6.4));
    place(L.shackle, V(-.22,.66,-.16), win(t,7.0,13.8));
    place(L.notrated, V(.22,.30,-.16), win(t,9.6,13.8));
    c1998.style.opacity = win(t,14.2,18.8);
    place(L.plan, V(100+6.2, relY, 0), win(t,21,27.5));
    place(L.gag, V(100+6.6, relY+1.6, 0), win(t,24.6,27.5));
    place(L.ruler, V(100-6.6, 13, 0), win(t,19.6,27.5));
    renderer.render(scene, cam);
  };
}

if (SCENE === 's7'){
  // Two rigs side by side: left = 1999 single-point, right = redundant rated rig.
  const left = new THREE.Group(); left.position.set(1.55,0,0); scene.add(left);
  const right = new THREE.Group(); right.position.set(-1.55,0,0); scene.add(right);
  buildDummy(left); buildDummy(right);
  const shL = buildShackle(left); shL.s.position.set(0,.47,-.16); shL.s.scale.setScalar(1.6);
  mesh(new THREE.CylinderGeometry(.006,.006,3), M.cable, [0,2.17,-.16], left);
  // proper: two independent lines w/ locking carabiners + spreader
  for (const s of [-1,1]){
    mesh(new THREE.CylinderGeometry(.007,.007,3), M.cable, [s*.11,2.1,-.16], right);
    const cb = mesh(new THREE.TorusGeometry(.04,.009,10,24), M.green, [s*.11,.56,-.16], right); cb.scale.set(.7,1.2,1);
    mesh(new THREE.CylinderGeometry(.012,.012,.03), M.green, [s*.11+.028,.56,-.16], right);
  }
  mesh(new THREE.BoxGeometry(.32,.03,.05), M.steel, [0,.62,-.16], right);
  for (const g of [left,right]) mesh(new THREE.CircleGeometry(.9,48), M.floor, [0,-.45,0], g).rotation.x=-Math.PI/2;
  scene.fog = null;
  const bad = document.createElement('div'); bad.className='col bad'; bad.style.left='90px';
  bad.innerHTML = '<h2>1999 rig</h2><div class="item">Marine snap shackle,<br>not rated for human loads</div><div class="item">Quick release could open<br>with very little force</div><div class="item">Single point of failure,<br>no redundant safety line</div>';
  const good = document.createElement('div'); good.className='col good'; good.style.left='1110px';
  good.innerHTML = '<h2>Life-safety rig</h2><div class="item">Rated, load-tested hardware<br>(locking connectors)</div><div class="item">No quick release on the<br>primary support line</div><div class="item">Independent backup line,<br>certified stunt riggers</div>';
  ui.append(bad, good);
  const tag = document.createElement('div'); tag.className='tag'; tag.textContent='FAILURE ANALYSIS'; ui.appendChild(tag);
  const bi = [...bad.querySelectorAll('.item')], gi = [...good.querySelectorAll('.item')];
  const hb = bad.querySelector('h2'), hg = good.querySelector('h2');
  renderAt = (t)=>{
    const a = .5*Math.sin(t*.25);
    cam.position.set(Math.sin(a)*5.2, 1.4, Math.cos(a)*-5.2*-1); cam.lookAt(0,.25,0);
    cam.position.set(Math.sin(a)*1.2, 1.5, -5.4); cam.lookAt(0,1.25,0);   // view from behind: shows back attachments
    hb.style.opacity = clamp(t/.6); hg.style.opacity = clamp((t-12)/.6);
    [3.2,6.0,8.6].forEach((s,i)=> bi[i].style.opacity = clamp((t-s)/.5));
    [12.6,14.4,16.2].forEach((s,i)=> gi[i].style.opacity = clamp((t-s)/.5));
    // shackle pops open on loop to show failure
    const ph = ((t-6)%4)/4; const open = t>6 ? sm(ph/.15)*(1-sm((ph-.7)/.2)) : 0;
    shL.gp.rotation.z = -1.25*open; shL.plunger.position.x = -.03-.03*open;
    renderer.render(scene, cam);
  };
}
window.renderAt = renderAt;
window.ready = true;
</script>
</body></html>
